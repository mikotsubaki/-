<style>
/* Layout: one narrow column, phone-first. Date bar on top, four tabs, each tab is one panel.
   Colors are 参拝帖's palette (C in SanpaiCho.jsx), always light like the original app. */
:root {
  --washi: #F4EEE1;
  --washi-deep: #EAE1CD;
  --paper: #FDFBF6;
  --sumi: #2B2622;
  --sumi-soft: #6B6055;
  --shu: #B93A2B;
  --ai: #2C4770;
  --kin: #A98B3F;
  --kichi: #DC8866;
  --saidai: #8C0001;
  --kyo: #B3AA97;
  --on-mark: #FDFBF6;
  --kin-wash: rgba(169,139,63,0.12);
  --shu-wash: rgba(185,58,43,0.08);
  --c-tora: #C79A3B;
  --c-kinoene: #6B4A8E;
  --c-fujoju: #8A8378;
  --moon-full: #F1DC94;
  --beni: #C7385F;
  --grid: #E0D5BC;
  --f-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--washi); }
body { background: var(--washi); color: var(--sumi); font-family: var(--f-body); font-size: 17px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 540px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
h1, h2, .mincho { font-family: var(--f-display); text-wrap: balance; }

/* header */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font-size: 30px; letter-spacing: 0.12em; color: var(--sumi); }
.top h1 span { color: var(--shu); }
.top .kanshi { font-size: 14px; color: var(--sumi-soft); text-align: right; line-height: 1.5; }

/* profile */
.profile { background: var(--paper); border: 1.5px solid var(--kin); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.profile .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; }
.profile .stars { font-size: 15px; background: var(--washi); border-radius: 8px; padding: 8px 10px; }
.profile .stars b { color: var(--shu); font-family: var(--f-display); font-size: 18px; }
.profile .sample { font-size: 13px; background: var(--washi-deep); color: var(--sumi-soft); border-radius: 999px; padding: 1px 10px; font-weight: 700; }
.linkbtn { background: none; border: none; color: var(--ai); text-decoration: underline; cursor: pointer; font-size: 15px; padding: 0; }
.birthform { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 16px; }
.birthform select { font: inherit; padding: 8px 6px; border-radius: 8px; border: 1px solid var(--washi-deep); background: var(--washi); color: var(--sumi); }
.btn { border-radius: 8px; padding: 10px 18px; border: 1px solid var(--shu); background: var(--shu); color: var(--on-mark); font-weight: 700; cursor: pointer; font-size: 16px; letter-spacing: 0.06em; }
.btn.ghost { background: var(--paper); color: var(--sumi); border-color: var(--washi-deep); font-weight: 400; letter-spacing: 0; }
.err { color: var(--shu); font-size: 14px; margin: 0; }

/* date bar */
.datebar { display: flex; gap: 6px; align-items: stretch; }
.datebar button, .datebar label { border: 1.5px solid var(--kin); background: var(--paper); border-radius: 8px; cursor: pointer; color: var(--sumi); }
.datebar .arrow { width: 46px; font-size: 22px; color: var(--kin); font-weight: 700; }
.datebar label { flex: 1; position: relative; text-align: center; padding: 9px; font-family: var(--f-display); font-weight: 700; font-size: 19px; }
.datebar label input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.datebar .today { padding: 0 14px; color: var(--shu); border-color: var(--shu); font-weight: 700; font-size: 15px; }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--washi-deep); border: 1.5px solid var(--kin); border-radius: 12px; padding: 5px; gap: 5px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: 0 2px 8px rgba(43,38,34,0.06); }

<div class="wrap">
  <header class="top">
    <h1>九星<span>方位</span>帖</h1>

  </header>

    <button role="tab" data-tab="koyomi" aria-selected="false">暦</button>
  </nav>

  <main id="main"></main>

  <p class="foot">吉方位・吉日は伝統的な暦法をもとにした独自の計算です(節入りは天文計算、九星は立春・節入り基準)。特定の流派の監修を受けたものではありません。</p>
</div>

<script>
(() => {
// ================= 暦・九星気学エンジン(参拝帖より移植) =================
const JIKKAN = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const SHI12 = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const ELEM10 = ["木","木","火","火","土","土","金","金","水","水"];
const GEN5 = { 木:"火", 火:"土", 土:"金", 金:"水", 水:"木" };
const KANSHI_NAME = (i) => JIKKAN[i % 10] + SHI12[i % 12];

const toJDN = (y, m, d) => { const a = Math.floor((14 - m) / 12), y2 = y + 4800 - a, m2 = m + 12 * a - 3; return d + Math.floor((153 * m2 + 2) / 5) + 365 * y2 + Math.floor(y2 / 4) - Math.floor(y2 / 100) + Math.floor(y2 / 400) - 32045; };
const kanshiIdx = (y, m, d) => (toJDN(y, m, d) + 49) % 60;

// 不成就日
const FUJOJU_TABLE = { 2026: { 1:[1,9,17,24], 2:[1,9,19,27], 3:[7,15,20,28], 4:[5,13,17,25], 5:[3,11,20,28], 6:[5,13,19,27], 7:[5,13,19,27], 8:[4,12,15,23,31], 9:[8,12,20,28], 10:[6,11,19,27], 11:[4,12,20,28], 12:[6,13,21,29] } };
const SYNODIC = 29.530588853, NM_EPOCH = 2451550.26;
const sunLongAt = (t) => ((280.46 + 0.9856474 * (t - 2451545)) % 360 + 360) % 360;
const kyurekiApprox = (y, m, d) => {
  const jd = toJDN(y, m, d);
  let age = (jd - NM_EPOCH) % SYNODIC; if (age < 0) age += SYNODIC;
  const ld = Math.floor(age) + 1, nmStart = jd - age, nmEnd = nmStart + SYNODIC;
  let lm = 0;
  for (let k = 0; k < 12; k++) { const L = k * 30; let t = 2451545 + (L - 280.46) / 0.9856474; t += Math.round((nmStart + SYNODIC / 2 - t) / 365.2422) * 365.2422; if (t >= nmStart && t < nmEnd) { lm = ((k + 1) % 12) + 1; break; } }
  if (lm === 0) lm = ((Math.floor(sunLongAt(nmStart) / 30) + 1) % 12) + 1;
  return { lm, ld };
};
const FUJOJU_START = [3, 2, 1, 4, 5, 6];
const isFujoju = (y, m, d) => {
  const tbl = FUJOJU_TABLE[y]; if (tbl) return (tbl[m] || []).includes(d);
  const { lm, ld } = kyureki(y, m, d); const fst = FUJOJU_START[(lm - 1) % 6];
  return ld >= fst && (ld - fst) % 8 === 0;
};

// 九星
const STAR_NAMES = ["","一白水星","二黒土星","三碧木星","四緑木星","五黄土星","六白金星","七赤金星","八白土星","九紫火星"];
const STAR_ELEM = ["","水","土","木","木","土","金","金","土","火"];
const DIRS8 = ["北","北東","東","南東","南","南西","西","北西"];
const TEII = { 北:1, 北東:8, 東:3, 南東:4, 南:9, 南西:2, 西:7, 北西:6 };
const OPP8 = { 北:"南", 南:"北", 北東:"南西", 南西:"北東", 東:"西", 西:"東", 南東:"北西", 北西:"南東" };
const BRANCH_DIR = ["北","北東","北東","東","南東","南東","南","南西","南西","西","北西","北西"];
const sunLongPrecise = (jd) => {
  const T = (jd - 2451545) / 36525;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = ((357.52911 + 35999.05029 * T - 0.0001537 * T * T) * Math.PI) / 180;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M) + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
  return (((L0 + C - 0.00569) % 360) + 360) % 360;
};
const jdAtJst = (y, m, d, h = 0) => toJDN(y, m, d) - 0.5 + (h - 9) / 24;
const jdToJstDate = (jd) => {
  const z = Math.floor(jd + 0.5 + 9 / 24);
  const a = z + 32044, b = Math.floor((4 * a + 3) / 146097), c = a - Math.floor((146097 * b) / 4);
  const dd = Math.floor((4 * c + 3) / 1461), e = c - Math.floor((1461 * dd) / 4), mm = Math.floor((5 * e + 2) / 153);
  return { y: 100 * b + dd - 4800 + Math.floor(mm / 10), m: mm + 3 - 12 * Math.floor(mm / 10), d: e - Math.floor((153 * mm + 2) / 5) + 1 };
};
const termCache = {};
const findTerm = (year, targetLong, gm, gd) => {
  const key = `${year}-${targetLong}`; if (termCache[key]) return termCache[key];
  const f = (jd) => { let x = sunLongPrecise(jd) - targetLong; while (x > 180) x -= 360; while (x < -180) x += 360; return x; };
  let a = jdAtJst(year, gm, gd) - 20;
  for (let i = 0; i < 45; i++) { if (f(a) < 0 && f(a + 1) >= 0) break; a += 1; }
  let b = a + 1;
  for (let i = 0; i < 26; i++) { const mid = (a + b) / 2; if (f(mid) < 0) a = mid; else b = mid; }
  return (termCache[key] = jdToJstDate((a + b) / 2));
};
const yearStarNum = (Y) => { let s = 11 - (Y % 9); while (s > 9) s -= 9; return s; };
const yearStarOf = (y, m, d) => { const rs = findTerm(y, 315, 2, 4); const Y = (m * 100 + d) < (rs.m * 100 + rs.d) ? y - 1 : y; return { star: yearStarNum(Y), baseYear: Y }; };
const SETSU_DEF = [[0,315,2,4],[1,345,3,6],[2,15,4,5],[3,45,5,5],[4,75,6,6],[5,105,7,7],[6,135,8,7],[7,165,9,8],[8,195,10,8],[9,225,11,7],[10,255,12,7],[11,285,13,6]];
const SETSU_NAME = ["立春","啓蟄","清明","立夏","芒種","小暑","立秋","白露","寒露","立冬","大雪","小寒"];
const setsuList = (Y) => SETSU_DEF.map(([idx, lon, mm, gd]) => { const t = findTerm(mm === 13 ? Y + 1 : Y, lon, mm === 13 ? 1 : mm, gd); return { idx, baseYear: Y, jdn: toJDN(t.y, t.m, t.d), t }; });
const setsuOf = (y, m, d) => { const jd = toJDN(y, m, d); const list = [...setsuList(y - 1), ...setsuList(y)].filter((e) => e.jdn <= jd); return list[list.length - 1]; };
const monthStarOf = (y, m, d) => {
  const cur = setsuOf(y, m, d); const ys = yearStarNum(cur.baseYear); const start = [8, 2, 5][(ys - 1) % 3];
  return { star: ((start - cur.idx - 1) % 9 + 9) % 9 + 1, idx: cur.idx };
};
const tonSwitchOf = (y, m, d) => {
  const jd = toJDN(y, m, d); const cands = [];
  [[y - 1, 270, 12, 22, true], [y, 90, 6, 21, false], [y, 270, 12, 22, true]].forEach(([yy, lon, gm, gd, yang]) => {
    const t = findTerm(yy, lon, gm, gd); const tj = toJDN(t.y, t.m, t.d); const r = kanshiIdx(t.y, t.m, t.d);
    const back = tj - r, fwd = back + 60; cands.push({ sw: (tj - back) <= (fwd - tj) ? back : fwd, yang });
  });
  const past = cands.filter((c) => c.sw <= jd);
  return past.length ? past.reduce((a, b) => (b.sw > a.sw ? b : a)) : cands[0];
};
const dayStarOf = (y, m, d) => { const use = tonSwitchOf(y, m, d); const off = ((toJDN(y, m, d) - use.sw) % 9 + 9) % 9; return use.yang ? off + 1 : 9 - off; };
const HOUR_LABELS = ["23〜1時","1〜3時","3〜5時","5〜7時","7〜9時","9〜11時","11〜13時","13〜15時","15〜17時","17〜19時","19〜21時","21〜23時"];
const hourStarOf = (y, m, d, h) => {
  const yang = tonSwitchOf(y, m, d).yang; const g = (kanshiIdx(y, m, d) % 12) % 3;
  const start = yang ? [1, 4, 7][g] : [9, 6, 3][g];
  return yang ? ((start - 1 + h) % 9) + 1 : ((start - 1 - h) % 9 + 9) % 9 + 1;
};
const banStars = (center) => { const o = {}; DIRS8.forEach((dir) => { o[dir] = ((TEII[dir] + center - 6) % 9 + 9) % 9 + 1; }); return o; };
const aishoOrHiwa = (a, b) => { const ea = STAR_ELEM[a], eb = STAR_ELEM[b]; return ea === eb || GEN5[ea] === eb || GEN5[eb] === ea; };
const kichiStarsOf = (honmei, getsumei) => {
  const kichi = [];
  for (let s = 1; s <= 9; s++) { if (s === 5 || s === honmei || s === getsumei) continue; if (aishoOrHiwa(s, honmei)) kichi.push(s); }
  const saidai = (getsumei === 5 || getsumei === honmei) ? [...kichi] : kichi.filter((s) => aishoOrHiwa(s, getsumei));
  return { kichi, saidai };
};
const judgeBan = (center, haDir, haLabel, honmei, getsumei) => {
  const stars = banStars(center); const { kichi, saidai } = kichiStarsOf(honmei, getsumei); const res = {};
  DIRS8.forEach((dir) => {
    const s = stars[dir], bad = [];
    if (s === 5) bad.push("五黄殺");
    if (stars[OPP8[dir]] === 5) bad.push("暗剣殺");
    if (s === honmei) bad.push("本命殺");
    if (stars[OPP8[dir]] === honmei) bad.push("本命的殺");
    if (getsumei !== honmei && s === getsumei) bad.push("月命殺");
    if (getsumei !== honmei && stars[OPP8[dir]] === getsumei) bad.push("月命的殺");
    if (dir === haDir) bad.push(haLabel);
    if (TEII[OPP8[dir]] === s) bad.push("定位対冲");
    const good = bad.length === 0 && kichi.includes(s);
    res[dir] = { star: s, bad, good, saidai: good && saidai.includes(s) };
  });
  return { center, dirs: res };
};
const judgeDayBan = (y, m, d, hon, get) => judgeBan(dayStarOf(y, m, d), BRANCH_DIR[(kanshiIdx(y, m, d) % 12 + 6) % 12], "日破", hon, get);
const judgeHourBan = (y, m, d, h, hon, get) => judgeBan(hourStarOf(y, m, d, h), BRANCH_DIR[(h + 6) % 12], "時破", hon, get);

// ---------- 暦注 ----------
// 判定ルールは「こよみのページ」の暦注解説に準拠(神吉日・大明日は日の干支、母倉日・受死日は節月と日の十二支)
const SHINKICHI = ["乙丑","丁卯","己巳","庚午","壬申","癸酉","丁丑","己卯","壬午","甲申","乙酉","戊子","辛卯","甲午","丙申","丁酉","己亥","庚子","辛丑","癸卯","乙巳","丙午","丁未","戊申","己酉","辛亥","壬子","乙卯","戊午","己未","庚申","辛酉","癸亥"];
const DAIMYO = ["己巳","庚午","辛未","壬申","癸酉","丁丑","己卯","壬午","甲申","丁亥","壬辰","乙未","壬寅","甲辰","乙巳","丙午","丁未","己酉","庚戌","辛亥","丙辰","戊午","己未","庚申","辛酉"];
// 節月(0=寅月=正月)ごとの母倉日の支(0=子)
const BOSO = [[0,11],[0,11],[5,6],[2,3],[2,3],[5,6],[1,4,7,10],[1,4,7,10],[5,6],[8,9],[8,9],[5,6]];
// 節月ごとの受死日の支
const JUSHI = [10,4,11,5,0,6,1,7,2,8,3,9];
const ROKUYO = ["大安","赤口","先勝","友引","先負","仏滅"];
const ROKUYO_DESC = {
  大安: "六曜でいちばんの吉日。何事にも吉とされる",
  赤口: "正午ごろだけが吉で、それ以外は凶とされる日",
  先勝: "午前が吉、午後は凶。急ぐことは早めに",
  友引: "朝夕は吉、昼は凶。お祝い事は良いが弔事は避ける",
  先負: "午前は凶、午後が吉。静かに過ごすのが良い日",
  仏滅: "六曜でいちばんの凶日。お祝い事は避けられることが多い",
};
const ICHIRYU = [[1,6],[9,2],[0,3],[3,4],[5,6],[6,9],[0,7],[3,8],[6,9],[9,0],[0,3],[3,6]];

// 新月・満月(Meeus『Astronomical Algorithms』49章。誤差は数分程度)
const moonPhaseJD = (k, full) => {
  const T = k / 1236.85, rad = Math.PI / 180;
  let jde = 2451550.09766 + 29.530588861 * k + 0.00015437 * T * T - 0.00000015 * T * T * T + 0.00000000073 * T ** 4;
  const E = 1 - 0.002516 * T - 0.0000074 * T * T;
  const M = (2.5534 + 29.1053567 * k - 0.0000014 * T * T) * rad;
  const Mp = (201.5643 + 385.81693528 * k + 0.0107582 * T * T + 0.00001238 * T ** 3) * rad;
  const F = (160.7108 + 390.67050284 * k - 0.0016118 * T * T - 0.00000227 * T ** 3) * rad;
  const O = (124.7746 - 1.56375588 * k + 0.0020672 * T * T) * rad;
  const sin = Math.sin;
  jde += (full ? -0.40614 : -0.40720) * sin(Mp) + (full ? 0.17302 : 0.17241) * E * sin(M)
    + (full ? 0.01614 : 0.01608) * sin(2 * Mp) + (full ? 0.01043 : 0.01039) * sin(2 * F)
    + (full ? 0.00734 : 0.00739) * E * sin(Mp - M) - (full ? 0.00515 : 0.00514) * E * sin(Mp + M)
    + (full ? 0.00209 : 0.00208) * E * E * sin(2 * M) - 0.00111 * sin(Mp - 2 * F) - 0.00057 * sin(Mp + 2 * F)
    + 0.00056 * E * sin(2 * Mp + M) - 0.00042 * sin(3 * Mp) + 0.00042 * E * sin(M + 2 * F)
    + 0.00038 * E * sin(M - 2 * F) - 0.00024 * E * sin(2 * Mp - M) - 0.00017 * sin(O)
    - 0.00007 * sin(Mp + 2 * M) + 0.00004 * sin(2 * Mp - 2 * F) + 0.00004 * sin(3 * M)
    + 0.00003 * sin(Mp + M - 2 * F) + 0.00003 * sin(2 * Mp + 2 * F) - 0.00003 * sin(Mp + M + 2 * F)
    + 0.00003 * sin(Mp - M + 2 * F) - 0.00002 * sin(Mp - M - 2 * F) - 0.00002 * sin(3 * Mp + M) + 0.00002 * sin(4 * Mp);
  return jde - 69 / 86400; // ΔT(約69秒)を引いて世界時に
};
const moonCache = {};
// その月の新月・満月 { "YYYY-MM-DD": { type: "new"|"full", hm: "HH:MM" } }
const moonsOfMonth = (y, m) => {
  const key = `${y}-${m}`;
  if (moonCache[key]) return moonCache[key];
  const out = {};
  const k0 = Math.floor((y + (m - 1) / 12 - 2000) * 12.3685) - 2;
  for (let k = k0; k <= k0 + 4; k++) {
    [[k, false], [k + 0.5, true]].forEach(([kk, full]) => {
      const jd = moonPhaseJD(kk, full);
      const dt = jdToJstDate(jd);
      if (dt.y !== y || dt.m !== m) return;
      const mins = Math.round((((jd + 0.5 + 9 / 24) % 1) + 1) % 1 * 1440) % 1440;
      out[`${y}-${String(m).padStart(2, "0")}-${String(dt.d).padStart(2, "0")}`] = { type: full ? "full" : "new", hm: `${Math.floor(mins / 60)}時${String(mins % 60).padStart(2, "0")}分` };
    });
  }
  return (moonCache[key] = out);
};


// 旧暦(天保暦の方式): 新月の日を朔日とし、中気を含む月の番号を決める。中気のない月は閏月
const nmDay = (k) => { const t = jdToJstDate(moonPhaseJD(k, false)); return toJDN(t.y, t.m, t.d); };
const kyurekiCache = {};
const kyureki = (y, m, d) => {
  const key = `${y}-${m}-${d}`;
  if (kyurekiCache[key]) return kyurekiCache[key];
  const jd = toJDN(y, m, d);
  let k = Math.floor((jd - 2451550.1) / 29.530588861);
  while (nmDay(k) > jd) k--;
  while (nmDay(k + 1) <= jd) k++;
  const monthOf = (kk) => {
    const a = nmDay(kk), b = nmDay(kk + 1);
    const L0 = sunLongPrecise(a - 0.5 - 9 / 24), L1 = sunLongPrecise(b - 0.5 - 9 / 24);
    const s0 = Math.floor(L0 / 30), s1 = Math.floor(L1 / 30);
    if (s0 === s1) return null; // 中気なし
    const L = ((s0 + 1) % 12) * 30;
    return ((L / 30 + 1) % 12) + 1;
  };
  let lm = monthOf(k), leap = false;
  if (lm === null) { leap = true; lm = monthOf(k - 1) || 12; }
  const res = { lm, ld: jd - nmDay(k) + 1, leap };
  return (kyurekiCache[key] = res);
};

const compassSVG = (dirs, centerStar, centerLabel, badge) => {
  const S = 300, c = S / 2, R = 104, r = 29;
  let s = `<svg class="compass" viewBox="0 0 ${S} ${S}" role="img" aria-label="${esc(centerLabel)} 中宮${STAR_NAMES[centerStar]}">`;
  s += `<circle class="ring-o" cx="${c}" cy="${c}" r="${R + r + 6}"/><circle class="ring-i" cx="${c}" cy="${c}" r="${R - r - 8}"/>`;
  DIRS8.forEach((d, i) => {
    const a = (i * 45 - 90) * Math.PI / 180;
    const x1 = c + Math.cos(a) * (R - r - 8), y1 = c + Math.sin(a) * (R - r - 8);
    const x2 = c + Math.cos(a) * (R - r), y2 = c + Math.sin(a) * (R - r);
    s += `<line class="spoke" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  });
  DIRS8.forEach((d, i) => {
    const a = (i * 45 - 90) * Math.PI / 180, x = c + Math.cos(a) * R, y = c + Math.sin(a) * R, info = dirs[d];
    const cls = info.saidai ? "saidai" : info.good ? "good" : info.bad.length ? "bad" : "";

    if (info.saidai) s += `<circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r + 4}"/>`;
    s += `<circle class="node ${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"/>`;
    s += `<text class="dir" x="${x.toFixed(1)}" y="${(y + 2).toFixed(1)}" text-anchor="middle">${d}</text>`;
    s += `<text class="star" x="${x.toFixed(1)}" y="${(y + 17).toFixed(1)}" text-anchor="middle">${STAR_NAMES[info.star].slice(0, 2)}</text></g>`;
  });
  s += `<text class="c-label" x="${c}" y="${c - 16}" text-anchor="middle">${esc(centerLabel)}</text>`;
  s += `<text class="c-star" x="${c}" y="${c + 9}" text-anchor="middle">${STAR_NAMES[centerStar]}</text>`;

    cells += `<button class="${cls}" data-d="${s}" aria-pressed="${s === state.calSel}" aria-label="${m}月${d}日 ${r.list.map((k) => k.label).join(" ")}"><span class="n">${d}</span>${r.list.map((k) => `<span class="ch ${k.cls}">${k.short}</span>`).join("")}</button>`;
  }
  const [sy, sm, sd] = parse(state.calSel);
  const sr = rekichuOf(sy, sm, sd);
  const kr = sr.kyureki;
  const shown = sr.list;
  const legend = [
    ["top", "天赦日", "最上の大吉日"],
    ["kichi", "一粒万倍", "開運の吉日"],
    ["roku", "先勝", "六曜"],
    ["rokuyo", "大安", "六曜の吉日"],
    ["sub", "神吉日", "暦注の吉日"],
    ["kyo", "仏滅", "凶日"],
    ["full", "満月", "新月・満月"],
  ];
  return `
    <div class="card calcard">
      <div class="calhead">
        <button id="calPrev" aria-label="前の月">‹</button>
        <span class="ym">${y}年 ${m}月<small>${reiwa}・旧暦${firstKr.leap ? "閏" : ""}${firstKr.lm}月${firstKr.ld}日から</small></span>
        <button id="calNext" aria-label="次の月">›</button>
      </div>
      <div class="cal" id="cal">${cells}</div>
      <div class="calleg">${legend.map(([c, t, l]) => `<div><span class="ch ${c}">${t}</span>${l}</div>`).join("")}</div>
    </div>
    <div class="card accent">
      <div style="display:flex;flex-direction:column;gap:2px">
        <h2>${fmtMD(state.calSel)}</h2>
        <div class="daysub"><span>${sr.kanshi}の日</span><span>旧暦 ${kr.leap ? "閏" : ""}${kr.lm}月${kr.ld}日</span><span>日盤 ${STAR_NAMES[dayStarOf(sy, sm, sd)]}</span></div>
      </div>
      ${shown.map((k) => `<div class="kday"><span class="ch ${k.cls}">${k.label}</span><span class="t">${k.desc}</span></div>`).join("")}
      <div><button class="btn ghost" id="seeDay">この日の吉方位を見る →</button></div>
    </div>
    <p class="note">カレンダー内の一部は短く表記しています(一粒万倍=一粒万倍日、己巳=己巳の日、甲子=甲子の日、不成就=不成就日)。暦注の判定は「こよみのページ」の解説に準拠し、旧暦・新月・満月・節入りは天文計算で求めています。不成就日は2026年分のみ公開暦データを収録しています。</p>`;
};

const render = () => {
  renderProfile();
  const [y, m, d] = parse(state.date);
  $("dayKanshi").innerHTML = `${KANSHI_NAME(kanshiIdx(y, m, d))}の日<br>日盤 ${STAR_NAMES[dayStarOf(y, m, d)]}`;
  $("dateText").textContent = fmtMD(state.date) + (state.date === todayStr() ? " 今日" : "");
  $("dateInput").value = state.date;
  $("toToday").hidden = state.date === todayStr();
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  const main = $("main");
  let html = "";
  try {
    html = ({ hoi: renderHoi, toki: renderToki, koyomi: renderKoyomi }[state.tab] || renderHoi)();
  } catch (e) { console.error(e); html = `<div class="card"><p>この日付は計算できませんでした。別の日付を選んでください。</p></div>`; }
  main.innerHTML = `<section class="panel" role="tabpanel">${html}</section>`;
  if (state.tab === "toki") main.querySelectorAll(".hour").forEach((b) => b.onclick = () => { state.hour = +b.dataset.h; render(); });
  if (state.tab === "koyomi") {
    main.querySelectorAll(".cal .d").forEach((b) => b.onclick = () => { state.calSel = b.dataset.d; render(); });
    $("calPrev").onclick = () => { let { y, m } = state.cal; m--; if (m < 1) { m = 12; y--; } state.cal = { y, m }; render(); };
    $("calNext").onclick = () => { let { y, m } = state.cal; m++; if (m > 12) { m = 1; y++; } state.cal = { y, m }; render(); };
    $("seeDay").onclick = () => setDate(state.calSel, "hoi");
  }
};

const setDate = (s, tab) => {
  state.date = s; state.hour = null;
  const [y, m] = parse(s); state.cal = { y, m }; state.calSel = s;
  if (tab) setTab(tab); else render();
};
const setTab = (t) => { state.tab = t; store.set("tab", t); render(); window.scrollTo({ top: 0 }); };

$("prevDay").onclick = () => setDate(shiftDate(state.date, -1));
$("nextDay").onclick = () => setDate(shiftDate(state.date, 1));
$("toToday").onclick = () => setDate(todayStr());
$("dateInput").onchange = (e) => { if (e.target.value) setDate(e.target.value); };
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => setTab(b.dataset.tab));

render();
})();
</script>

</body>
</html>
